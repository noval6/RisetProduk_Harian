.pseller{font-size:12px;color:var(--mut);margin-bottom:12px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.m{background:var(--card2);border-radius:9px;padding:7px 9px}
.m .mv{font-size:14px;font-weight:700}

.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.bd{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.3px}
.bd.rev{background:rgba(255,122,26,.15);color:var(--accent2)}
.bd.up{background:rgba(61,220,132,.13);color:var(--good)}
.bd.down{background:rgba(255,93,93,.13);color:var(--bad)}
.bd.inv{background:rgba(255,122,26,.2);color:var(--accent)}
.pos{color:var(--good)}.neg{color:var(--bad)}

.overlay.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:600px;width:100%;padding:24px}
.mclose{float:right;background:var(--card2);border:none;color:var(--txt);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:17px}
.mtitle{font-size:18px;font-weight:800;line-height:1.35;margin:4px 48px 4px 0}
.mseller{color:var(--mut);font-size:13px;margin-bottom:16px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.mg{background:var(--card2);border-radius:11px;padding:11px}
.mg .v{font-size:16px;font-weight:800}
.mg .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.usp{background:linear-gradient(135deg,rgba(255,122,26,.1),rgba(255,122,26,.03));border:1px solid rgba(255,122,26,.25);border-radius:12px;padding:14px 16px;margin-bottom:18px}

.usp p{font-size:14px;line-height:1.55}
.mlinks{display:flex;gap:10px;flex-wrap:wrap}
.lnk{flex:1;min-width:150px;text-align:center;padding:12px;border-radius:11px;text-decoration:none;font-weight:700;font-size:13px}
.lnk.k{background:var(--accent);color:#0b0b0f}
.lnk.t{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.lnk:hover{opacity:.88}
.invnote{font-size:12px;color:var(--accent2);background:rgba(255,122,26,.1);border-radius:9px;padding:8px 11px;margin-bottom:16px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.mgrid{grid-template-columns:repeat(2,1fr)}h1{font-size:18px}}
</style>
