<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riset Produk Harian - LebihCakep</title>
<style>
:root{--bg:#0b0b0f;--card:#15151c;--accent:#ff7a1a;--txt:#e8e8ee;--muted:#8a8a99;--line:#24242e;--good:#34d399;--bad:#f87171;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;padding-bottom:40px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:28px 0 18px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.date{color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px}
.stat .n{font-size:24px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:20}
.tab{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);color:#0b0b0f;border-color:var(--accent)}
.tab .c{opacity:.7;font-weight:500}
.panel{display:none}
.panel.active{display:block}
.pnote{color:var(--muted);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.rank{position:absolute;top:-8px;left:-8px;background:var(--accent);color:#0b0b0f;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.badges{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.badge{font-size:16px}
.ctitle{font-size:14px;font-weight:600;margin:6px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;padding-right:30px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.m{background:#0e0e14;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.m .mv{font-size:14px;font-weight:700}
.m .ml{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.tag{display:inline-block;background:rgba(255,122,26,.14);color:var(--accent);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:10px}
.tag.inv{background:rgba(52,211,153,.14);color:var(--good)}
.tag.flag{background:rgba(248,113,113,.14);color:var(--bad)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;position:relative}
.close{position:absolute;top:14px;right:16px;font-size:26px;color:var(--muted);cursor:pointer;line-height:1}
.mtitle{font-size:17px;font-weight:700;margin:0 24px 14px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.mgrid .m .mv{font-size:15px}
.usp{background:#0e0e14;border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:14px;color:#d4d4dd}
.usp b{color:var(--accent)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:140px;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px}
.btn.k{background:#1f1f29;color:var(--txt);border:1px solid var(--line)}
.btn.t{background:var(--accent);color:#0b0b0f}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
</style>
</head>

function gcls(g){if(g==null)return'';const s=String(g);if(s.includes('-'))return'neg';if(s==='-')return'';return'pos';}
function tiktok(id){return 'https://shop.tiktok.com/view/product/'+id+'?region=ID&locale=id-ID&source=agency';}
function kalo(id){return 'https://www.kalodata.com/product/detail?id='+id;}
const tabsEl=document.getElementById('tabs'),panelsEl=document.getElementById('panels');
DATA.forEach((cat,ci)=>{
  const t=document.createElement('div');t.className='tab'+(ci===0?' active':'');
  t.innerHTML=cat.icon+' '+cat.label+' <span class="c">('+cat.products.length+')</span>';
  t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('panel-'+ci).classList.add('active');};
  tabsEl.appendChild(t);
  const p=document.createElement('div');p.className='panel'+(ci===0?' active':'');p.id='panel-'+ci;
  const note=document.createElement('div');note.className='pnote';note.textContent=cat.pass+' produk lolos filter (harga 20-400rb, komisi >=8%, kreator <=200) - ditampilkan Top '+cat.products.length+' by revenue 30 hari.';
  p.appendChild(note);
  const g=document.createElement('div');g.className='grid';
  cat.products.forEach((pr,i)=>{
    const c=document.createElement('div');c.className='card';

function openModal(pr){
  const b=document.getElementById('mbody');
  let tags='';if(pr.inv)tags+='<span class="tag inv">&#128293; '+pr.invBrand+' ada di inventory</span> ';if(pr.flag)tags+='<span class="tag flag">&#9888;&#65039; '+pr.flag+'</span>';

    '<div class="m"><div class="mv">'+pr.rev+'</div><div class="ml">Revenue</div></div>'+
    '<div class="m"><div class="mv '+gcls(pr.growth)+'">'+pr.growth+'</div><div class="ml">Growth</div></div>'+
    '<div class="m"><div class="mv">'+pr.price+'</div><div class="ml">Harga</div></div>'+
    '<div class="m"><div class="mv">'+pr.comm+'</div><div class="ml">Komisi</div></div>'+
    '<div class="m"><div class="mv">'+pr.conv+'</div><div class="ml">Konv. Kreator</div></div>'+
    '<div class="m"><div class="mv">'+pr.creators+'</div><div class="ml">Jml Kreator</div></div>'+
    '<div class="m"><div class="mv">'+pr.sale+'</div><div class="ml">Terjual</div></div>'+
    '<div class="m"><div class="mv">'+pr.rating+'</div><div class="ml">Rating</div></div>'+
    '</div>'+
    '<div class="usp"><b>USP / Angle Konten:</b><br>'+pr.usp+'</div>'+
    '<div class="links"><a class="btn k" href="'+kalo(pr.id)+'" target="_blank" rel="noopener">Kalodata Detail</a><a class="btn t" href="'+tiktok(pr.id)+'" target="_blank" rel="noopener">TikTok Shop</a></div>';
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('mclose').onclick=()=>document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').onclick=(e)=>{if(e.target.id==='overlay')document.getElementById('overlay').classList.remove('show');};
</script>
