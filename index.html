:root{--bg:#0b0b0f;--card:#15151c;--accent:#ff7a1a;--accent2:#ffb37a;--txt:#f2f2f5;--mut:#8b8b96;--line:#24242e;--green:#35d07f;--red:#ff5c6c;--chip:#1e1e28;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding:0 16px 60px}
.wrap{max-width:1100px;margin:0 auto}
header{padding:28px 0 18px;border-bottom:1px solid var(--line)}
h1{font-size:24px;font-weight:800;letter-spacing:-.4px}
h1 .mk{color:var(--accent)}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;flex:1;min-width:130px}
.stat .n{font-size:22px;font-weight:800;color:var(--accent)}
.stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.note{background:#1a1407;border:1px solid #3a2a10;color:var(--accent2);font-size:12.5px;border-radius:10px;padding:10px 14px;margin:16px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 18px}
.tab{background:var(--chip);border:1px solid var(--line);color:var(--mut);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{color:var(--txt)}
.tab.active{background:var(--accent);color:#120a02;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .rank{position:absolute;top:12px;right:14px;font-size:12px;font-weight:800;color:var(--mut)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.b{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.3px}
.b.inv{background:#2a1405;color:var(--accent)}
.b.early{background:#06281a;color:var(--green)}
.b.best{background:#2a2206;color:#ffd84d}
.b.flag{background:#2a0d10;color:var(--red)}
.card h3{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:10px;padding-right:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seller{font-size:11.5px;color:var(--mut);margin-bottom:12px}
.m{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-top:1px solid var(--line)}
.m:first-of-type{border-top:none}
.m .k{color:var(--mut)}
.m .v{font-weight:700}
.v.pos{color:var(--green)}.v.neg{color:var(--red)}.v.acc{color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;padding:24px}
.modal .x{float:right;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
.modal h2{font-size:17px;font-weight:800;line-height:1.35;margin-bottom:6px;padding-right:20px}
.modal .ms{font-size:12.5px;color:var(--mut);margin-bottom:16px}
.mrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.mstat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex:1;min-width:95px}
.mstat .mv{font-size:15px;font-weight:800}
.mstat .ml{font-size:10px;color:var(--mut);text-transform:uppercase;margin-top:2px}
.usp{background:var(--bg);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:16px}
.usp .t{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.lk{flex:1;min-width:150px;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:11px;border-radius:10px}
.lk.k{background:var(--chip);color:var(--txt);border:1px solid var(--line)}
.lk.t{background:var(--accent);color:#120a02}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;text-align:center}
.hide{display:none}
</style>
</head>

function renderTabs(){
  const t=document.getElementById("tabs");

    return '<div class="tab'+(n===active?' active':'')+'" data-n="'+n+'">'+n+' ('+c+')</div>';

  const g=document.getElementById("grid");

    return '<div class="card" data-id="'+p.id+'">'+

  }).join("");

    '</div>'+

    (p.flag?'<div class="usp" style="border-color:var(--red)"><div class="t" style="color:var(--red)">Catatan</div>'+p.flag+'</div>':'')+
    '<div class="links">'+
