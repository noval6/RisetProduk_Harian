*{box-sizing:border-box;margin:0;padding:0}

.tab.active{background:var(--accent);color:#1a1200;border-color:var(--accent)}
.tab .c{opacity:.65;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}

.met{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px}
.met div{color:var(--mut)}
.met b{color:var(--txt);font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
.foot-line{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.mbox h2{font-size:17px;margin-bottom:6px}
.mbrand{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase}
.mmet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.mmet .box{background:#1d1d26;border-radius:10px;padding:10px 12px}
.mmet .box span{display:block;color:var(--mut);font-size:11px}
.mmet .box b{font-size:15px}
.usp{background:#1d1510;border:1px solid #3a2a16;border-radius:10px;padding:12px 14px;font-size:13.5px;margin:6px 0 16px}
.usp .lbl{color:var(--accent);font-weight:700;font-size:12px;display:block;margin-bottom:4px;text-transform:uppercase}
.links{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;text-align:center;padding:11px;border-radius:10px;font-weight:700;font-size:13px;text-decoration:none;min-width:140px}
.btn.k{background:#232330;color:var(--txt);border:1px solid var(--line)}
.btn.t{background:var(--accent);color:#1a1200}
.close{float:right;color:var(--mut);cursor:pointer;font-size:22px;line-height:1;margin-top:-6px}
.invnote{background:#0f2016;border:1px solid #1d4a2e;color:var(--good);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:520px){.met{grid-template-columns:1fr 1fr}h1{font-size:22px}}
